<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Charge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Charge">
<meta name="application-name" content="Charge">
<style>
:root{
  color-scheme:light dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --spring:cubic-bezier(.3,1.35,.45,1);
  --out:cubic-bezier(.2,.9,.25,1);
  --r-group:24px;
  --ga-l:.62;--ga-d:.65;--glass-blur:20px;--sheen:.7;

  --bg:#F2F2F7;--card:#FFFFFF;--fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.22);
  --label:#000;--label-2:rgba(60,60,67,.68);--label-3:rgba(60,60,67,.36);--sep:rgba(60,60,67,.17);
  --tint:#007C8A;--on-tint:#fff;--tint-soft:rgba(0,124,138,.12);--tint-ink:#006A75;
  --green:#34C759;--green-ink:#1E7A35;--orange:#FF9500;--orange-ink:#B35400;--red:#FF3B30;--red-ink:#C42B1F;
  --pink:#FF2D55;--pink-ink:#C8103F;--cyan:#32ADE6;--cyan-ink:#0A6E9C;--indigo:#5856D6;
  --glass-rgb:250 250 252;--glass-a:var(--ga-l);--glass-hi:rgba(255,255,255,.95);--glass-stroke:rgba(255,255,255,.6);
  --shadow:0 10px 30px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
  --wall-a:rgba(0,176,196,.22);--wall-b:rgba(255,149,0,.14);
  --sheet:rgb(248 248 251 / .95);--lens:rgba(118,118,128,.16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.38);
    --label:#fff;--label-2:rgba(235,235,245,.66);--label-3:rgba(235,235,245,.32);--sep:rgba(84,84,88,.55);
    --tint:#3FD0D9;--on-tint:#00292D;--tint-soft:rgba(63,208,217,.16);--tint-ink:#5ADBE3;
    --green:#30D158;--green-ink:#30D158;--orange:#FF9F0A;--orange-ink:#FF9F0A;--red:#FF453A;--red-ink:#FF6961;
    --pink:#FF375F;--pink-ink:#FF6482;--cyan:#64D2FF;--cyan-ink:#64D2FF;--indigo:#5E5CE6;
    --glass-rgb:42 42 46;--glass-a:var(--ga-d);--glass-hi:rgba(255,255,255,.16);--glass-stroke:rgba(255,255,255,.12);
    --shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
    --wall-a:rgba(0,150,170,.30);--wall-b:rgba(94,92,230,.22);
    --sheet:rgb(28 28 30 / .95);--lens:rgba(255,255,255,.13);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000;--card:#1C1C1E;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.38);
  --label:#fff;--label-2:rgba(235,235,245,.66);--label-3:rgba(235,235,245,.32);--sep:rgba(84,84,88,.55);
  --tint:#3FD0D9;--on-tint:#00292D;--tint-soft:rgba(63,208,217,.16);--tint-ink:#5ADBE3;
  --green:#30D158;--green-ink:#30D158;--orange:#FF9F0A;--orange-ink:#FF9F0A;--red:#FF453A;--red-ink:#FF6961;
  --pink:#FF375F;--pink-ink:#FF6482;--cyan:#64D2FF;--cyan-ink:#64D2FF;--indigo:#5E5CE6;
  --glass-rgb:42 42 46;--glass-a:var(--ga-d);--glass-hi:rgba(255,255,255,.16);--glass-stroke:rgba(255,255,255,.12);
  --shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --wall-a:rgba(0,150,170,.30);--wall-b:rgba(94,92,230,.22);
  --sheet:rgb(28 28 30 / .95);--lens:rgba(255,255,255,.13);
}
:root[data-theme="light"]{color-scheme:light}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:inherit}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font:400 17px/1.3 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 55% at 8% -14%,var(--wall-a),transparent 62%),radial-gradient(80% 45% at 106% -6%,var(--wall-b),transparent 58%),var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none}
.num{font-family:var(--font-round);font-variant-numeric:tabular-nums}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.app{max-width:600px;margin:0 auto;padding:0 16px calc(118px + env(safe-area-inset-bottom,0px))}
.view{animation:viewIn .3s var(--out)}
@keyframes viewIn{from{opacity:0}to{opacity:1}}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:rgb(var(--glass-rgb) / var(--glass-a));-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.8);backdrop-filter:blur(var(--glass-blur)) saturate(1.8);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-stroke)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.4),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 72%,rgba(255,255,255,.12));opacity:var(--sheen)}

/* ---------- Navigation ---------- */
.nav{padding:14px 4px 10px}
.nav-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.nav-sub{margin:0;font:600 15px/20px var(--font);color:var(--label-2)}
.t-large{margin:2px 0 0;font:700 34px/41px var(--font-display);letter-spacing:.01em}
.circle-btn{position:relative;width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;color:var(--label);flex:none;background:none}
.circle-btn.sm{width:34px;height:34px;background:var(--fill);color:var(--label-2)}
.circle-btn.sm .ic{width:18px;height:18px}
.circle-btn.tint{width:44px;height:44px;background:var(--tint);color:var(--on-tint)}
.edge{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(env(safe-area-inset-top,0px) + 50px);padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
.edge::before{content:"";position:absolute;inset:0;-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);background:linear-gradient(to bottom,rgb(var(--glass-rgb) / .75),rgb(var(--glass-rgb) / 0));-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}
.edge span{position:relative;font:600 17px/22px var(--font)}
.edge.on{opacity:1}

/* ---------- Groups & rows ---------- */
.section-h{margin:28px 4px 10px;font:700 20px/25px var(--font-display)}
.sub-h{margin:22px 4px 8px;font:700 18px/23px var(--font-display)}
.group{background:var(--card);border-radius:var(--r-group);overflow:hidden}
.tappable{cursor:pointer;transition:transform .3s var(--spring)}
.tappable:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:11px 16px;position:relative;border:0;background:none;text-align:left;font-size:17px}
.row.top{align-items:flex-start}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .grow,.grow{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:16px;line-height:21px}
.row small{display:block;margin-top:2px;color:var(--label-2);font-size:14px;line-height:19px}
.row .val{color:var(--label-2);font-size:15px;white-space:nowrap}
.chev{width:18px;height:18px;color:var(--label-3)}
.ico-tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--tile,var(--tint));color:#fff}
.ico-tile .ic{width:18px;height:18px}
.foot-note{margin:8px 16px 0;color:var(--label-2);font-size:13px;line-height:18px}
.empty{margin:0;padding:22px 18px;text-align:center;color:var(--label-2);font-size:15px;line-height:20px}

/* ---------- Buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border:0;border-radius:999px;font:600 17px/1.1 var(--font);transition:transform .25s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn .ic{width:19px;height:19px}
.btn-tint{background:var(--tint);color:var(--on-tint)}
.btn-plain{background:var(--fill);color:var(--tint-ink)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{min-height:38px;padding:0 15px;font-size:15px}
.btn-sm .ic{width:17px;height:17px}
.btn-block{display:flex;width:100%}
.danger-text{color:var(--red-ink)}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:18px 20px 20px;color:#fff;background:linear-gradient(140deg,var(--h1),var(--h2));box-shadow:0 22px 40px -22px var(--h1)}
.hero::before{content:"";position:absolute;right:-30%;bottom:-60%;width:110%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
.hero>*{position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-kicker{font:600 15px/20px var(--font);opacity:.9}
.hero-pill{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);font:600 13px/18px var(--font);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35)}
.hero-title{margin:12px 0 2px;font:800 42px/46px var(--font-display);letter-spacing:-.01em}
.hero-focus{margin:0;font:500 17px/22px var(--font);opacity:.92}
.hero-stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin:18px 0 20px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font:700 26px/30px var(--font-round);font-variant-numeric:tabular-nums}
.hero-stats span{font-size:13px;line-height:17px;opacity:.85}
.btn-hero{width:100%;background:rgba(255,255,255,.94);color:var(--h2);box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.btn-hero.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.45),inset 0 1px 0 rgba(255,255,255,.4)}

/* ---------- Today ---------- */
.week{padding:16px 14px 14px}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wday span{display:block;margin-bottom:7px;font:600 13px/18px var(--font);color:var(--label-2)}
.wday.today span{color:var(--tint-ink)}
.dot{display:grid;place-items:center;width:34px;height:34px;margin:0 auto;border-radius:50%;background:var(--fill)}
.dot.planned{background:transparent;box-shadow:inset 0 0 0 2px var(--tint)}
.dot.done{background:var(--tint);color:var(--on-tint)}
.dot .ic{width:18px;height:18px;stroke-width:2.6}
.wday.today .dot{transform:scale(1.08);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--tint-soft)}
.wday.today .dot.planned{box-shadow:inset 0 0 0 2px var(--tint),0 0 0 3px var(--card),0 0 0 5px var(--tint-soft)}
.week-foot{margin:14px 4px 0;font-size:15px;line-height:20px;color:var(--label-2)}
.week-foot b{color:var(--label);font-weight:600}
.ring-card{display:flex;align-items:center;gap:16px;padding:16px}
.rings{flex:none}
.legend{flex:1;display:grid;gap:6px;min-width:0}
.lg{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--label-2);white-space:nowrap}
.lg b{font:700 22px/26px var(--font-round);font-variant-numeric:tabular-nums}
.wmini{display:flex;align-items:center;gap:14px;padding:16px}
.wbig{display:flex;align-items:baseline;gap:5px}
.wbig b{font:700 34px/38px var(--font-round)}
.wbig span{font:600 17px var(--font);color:var(--label-2)}
.wmini small,.wcard small{display:block;margin-top:4px;color:var(--label-2);font-size:14px;line-height:19px}
.tip{display:flex;gap:12px;padding:16px;font-size:16px;line-height:22px}
.tip .ic{color:var(--orange);margin-top:1px}
.tip p{margin:0}

.install{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;padding:14px 16px}
.install b{display:block;font-weight:600;font-size:16px;line-height:21px}
.install small{display:block;margin-top:2px;font-size:14px;line-height:19px;color:var(--label-2)}
.install-btns{display:flex;gap:8px;margin-top:10px}
label.frow,button.frow{cursor:pointer}

/* ---------- Program ---------- */
.cycle{padding:16px}
.seg6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:14px}
.seg6 i{height:8px;border-radius:4px;background:var(--fill-2)}
.seg6 i.past{background:color-mix(in srgb,var(--tint) 45%,transparent)}
.seg6 i.now{background:var(--tint)}
.cycle h3{display:flex;align-items:center;gap:8px;margin:0;font:700 20px/25px var(--font-display)}
.cycle p{margin:6px 0 0;color:var(--label-2);font-size:15px;line-height:20px}
.badge{padding:3px 9px;border-radius:999px;background:var(--tint-soft);color:var(--tint-ink);font:700 12px/17px var(--font-round)}
.days-line{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px}
.days-line .dchips{display:flex;gap:4px;flex:1;min-width:0}
.days-line .days-edit{color:var(--tint-ink);font-size:15px;font-weight:500}
.dchip{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--fill);font:600 13px var(--font);color:var(--label-2)}
.dchip.on{background:var(--tint);color:var(--on-tint)}
.tpl{margin-bottom:16px}
.tpl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;color:#fff;background:linear-gradient(140deg,var(--h1),var(--h2))}
.tpl-head h3{margin:0;font:800 24px/28px var(--font-display)}
.tpl-head p{margin:2px 0 0;font-size:15px;opacity:.9}
.pill{flex:none;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.2);font:600 13px/18px var(--font)}
.ex-list{list-style:none;margin:0;padding:0}
.ex-row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 12px 9px 16px;border:0;background:none;text-align:left;position:relative}
.ex-list li+li .ex-row::before{content:"";position:absolute;top:0;left:54px;right:0;border-top:.5px solid var(--sep)}
.ex-n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font:700 13px/1 var(--font-round);color:var(--label-2)}
.ex-txt{flex:1;min-width:0}
.ex-txt b{display:block;font:600 16px/21px var(--font)}
.ex-txt small{display:block;font-size:13px;line-height:17px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-pres{font:600 15px/1 var(--font-round);color:var(--label-2);white-space:nowrap}
.tpl-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 12px 16px;border-top:.5px solid var(--sep);color:var(--label-2);font-size:15px}
.tpl-foot span{display:inline-flex;align-items:center;gap:6px}
.tpl-foot span .ic{width:17px;height:17px}

/* ---------- Sheets content ---------- */
.sheet-title{padding:4px 44px 12px 2px}
.sheet-title h2{margin:0;font:700 28px/34px var(--font-display)}
.sheet-title p{margin:6px 0 0;color:var(--label-2);font-size:15px;line-height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{padding:6px 12px;border-radius:999px;background:var(--tint-soft);color:var(--tint-ink);font:600 13px/18px var(--font)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 4px;background:var(--card);border-radius:var(--r-group)}
.stats3.flat{background:none;border-radius:0;border-top:.5px solid var(--sep);margin-top:6px}
.stats3>div{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:0 4px}
.stats3>div+div::before{content:"";position:absolute;left:0;top:4px;bottom:4px;border-left:.5px solid var(--sep)}
.stats3 b{font:700 21px/26px var(--font-round);font-variant-numeric:tabular-nums}
.stats3 span{font-size:12px;line-height:16px;color:var(--label-2)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;background:var(--card);border-radius:var(--r-group)}
.steps li{position:relative;padding:12px 16px 12px 54px;font-size:16px;line-height:21px;counter-increment:s}
.steps li+li::before{content:"";position:absolute;top:0;left:54px;right:0;border-top:.5px solid var(--sep)}
.steps li::after{content:counter(s);position:absolute;left:16px;top:11px;width:24px;height:24px;border-radius:50%;background:var(--tint-soft);color:var(--tint-ink);font:700 13px/24px var(--font-round);text-align:center}
.callout{display:flex;gap:10px;align-items:flex-start;margin:12px 0;padding:13px 14px;border-radius:20px;background:var(--fill);font-size:15px;line-height:20px}
.callout>.ic{flex:none;width:20px;height:20px;margin-top:1px;color:var(--label-2)}
.callout p{margin:0}
.callout.warn{background:color-mix(in srgb,var(--orange) 14%,transparent)}
.callout.warn>.ic{color:var(--orange-ink)}
.callout.good{background:color-mix(in srgb,var(--green) 14%,transparent)}
.callout.good>.ic{color:var(--green-ink)}
.field{display:block;margin:0 0 14px}
.field>span{display:block;margin:0 4px 6px;font:600 13px/18px var(--font);color:var(--label-2)}
.field input{width:100%;height:50px;border:0;border-radius:14px;background:var(--fill);padding:0 14px;font:500 17px var(--font);color:var(--label);-webkit-appearance:none;appearance:none}
.field input.big-input{height:78px;font:700 44px/1 var(--font-round);text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

/* ---------- Forms (settings) ---------- */
.frow{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 16px;position:relative;border:0;background:none;text-align:left;font-size:17px}
.frow+.frow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.frow>span:first-child{flex:1}
.frow .fin{width:90px;padding:6px 0;border:0;background:none;text-align:right;font:500 17px var(--font-round);color:var(--label-2);-webkit-appearance:none;appearance:none}
.frow .fin:focus{outline:none;color:var(--tint-ink)}
.frow em{min-width:24px;font-style:normal;font-size:15px;color:var(--label-2)}
.frow select{max-width:64%;padding:6px 0;border:0;background:none;text-align:right;text-align-last:right;font:500 16px var(--font);color:var(--tint-ink);-webkit-appearance:none;appearance:none}
.frow.col{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px 14px}
.frow .link{padding:6px 0;border:0;background:none;font:500 16px var(--font);color:var(--tint-ink)}
.frow.danger{justify-content:center;color:var(--red-ink);font-weight:600}
.frow b{font-weight:500;color:var(--label-2)}
.switch{position:relative;flex:none;width:51px;height:31px;margin:0;border-radius:999px;background:var(--fill-2);-webkit-appearance:none;appearance:none;transition:background .25s;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .35s var(--spring)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(20px)}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--fill)}
.seg button{flex:1;min-height:34px;padding:0 6px;border:0;border-radius:999px;background:none;font:600 14px var(--font);color:var(--label);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg-wide{margin-bottom:12px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dp{height:40px;border:0;border-radius:999px;background:var(--fill);font:600 15px var(--font);color:var(--label)}
.dp.on{background:var(--tint);color:var(--on-tint)}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row small{font-size:13px;color:var(--label-2)}
input[type=range]{flex:1;accent-color:var(--tint)}

/* ---------- Nutrition ---------- */
.nutri-top{display:flex;align-items:center;gap:16px;padding:18px 16px}
.water{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 12px 12px 16px}
.water .grow b{display:block;font:700 20px/24px var(--font-round)}
.water .grow small{display:block;font-size:14px;color:var(--label-2)}
.stepper{display:flex;gap:6px}
.stepper button{width:46px;height:40px;border:0;border-radius:999px;background:var(--fill);display:grid;place-items:center;color:var(--tint-ink)}
.food-row .add{width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tint-soft);color:var(--tint-ink);transition:transform .25s var(--spring)}
.food-row .add:active{transform:scale(.86)}
.kcal-big{display:flex;align-items:baseline;gap:8px;padding:18px 16px 4px}
.kcal-big b{font:800 44px/1 var(--font-round)}
.kcal-big span{color:var(--label-2);font-size:15px}
.macro{display:grid;gap:12px;padding:14px 16px 16px}
.mbar{display:grid;grid-template-columns:84px 1fr 56px;align-items:center;gap:10px;font-size:15px}
.mbar i{display:block;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.mbar i b{display:block;height:100%;border-radius:4px}
.mbar .num{text-align:right;font-weight:600}
.how{border-top:.5px solid var(--sep)}
.how summary{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 16px;list-style:none;cursor:pointer;color:var(--tint-ink);font-weight:500}
.how summary::-webkit-details-marker{display:none}
.how[open] summary .chev{transform:rotate(90deg)}
.how summary .chev{transition:transform .3s var(--out)}
.how-body{padding:0 16px 16px;font-size:15px;line-height:21px;color:var(--label-2)}
.how-body p{margin:0 0 10px}
.how-body b{color:var(--label)}
.timeline{list-style:none;margin:0;padding:0;background:var(--card);border-radius:var(--r-group)}
.timeline li{position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 16px}
.timeline li+li::before{content:"";position:absolute;top:0;left:92px;right:0;border-top:.5px solid var(--sep)}
.tl-time{font:700 15px/21px var(--font-round);color:var(--tint-ink)}
.timeline b{display:block;font-weight:600;font-size:16px;line-height:21px}
.timeline p{margin:3px 0 5px;font-size:15px;line-height:20px;color:var(--label-2)}
.timeline small{font:600 13px var(--font-round);color:var(--label-2)}

/* ---------- Progress ---------- */
.wcard{padding:16px 16px 0}
.wc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 11px var(--font-round);fill:var(--label-2)}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .avg{fill:none;stroke:var(--tint);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .area{fill:url(#chartFill);stroke:none}
.chart .pt{fill:var(--card);stroke:var(--tint);stroke-width:2.5}
.chart .pt-s{fill:var(--label-3)}
.fcard{padding:12px 16px 14px}
.picker{position:relative;display:flex;align-items:center;margin-bottom:8px}
.picker select{width:100%;height:42px;padding:0 36px 0 14px;border:0;border-radius:12px;background:var(--fill);font:600 16px var(--font);color:var(--label);-webkit-appearance:none;appearance:none}
.picker .ic{position:absolute;right:12px;width:18px;height:18px;color:var(--label-2);pointer-events:none}
.fcap{margin:6px 0 0;font-size:13px;line-height:18px;color:var(--label-2)}
.fcap b{color:var(--label);font-weight:600}
.pr-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange-ink);font:700 13px/18px var(--font-round)}
.pr-badge .ic{width:14px;height:14px}

/* ---------- Coach ---------- */
.chat{padding:16px;background:var(--card);border-radius:26px}
.chat-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.chat-head b{display:block;font-weight:600}
.chat-head small{display:block;font-size:14px;line-height:19px;color:var(--label-2)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:22px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--tint);color:var(--on-tint);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--fill);border-bottom-left-radius:6px}
.msg p{margin:0 0 6px}.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:4px 0 6px;padding-left:20px}
.msg li{margin:2px 0}
.msg-err{align-self:flex-start;margin:0 4px;font-size:14px;color:var(--red-ink)}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--label-2);font-size:15px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--tint);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.sugg button{padding:8px 12px;border:0;border-radius:999px;background:var(--tint-soft);color:var(--tint-ink);font:600 14px/18px var(--font);text-align:left}
.composer{display:flex;align-items:flex-end;gap:8px;margin-top:12px;padding:6px 6px 6px 16px;border-radius:24px;background:var(--fill)}
.composer textarea{flex:1;min-height:36px;max-height:120px;padding:7px 0;border:0;background:none;resize:none;font:16px/22px var(--font);color:var(--label)}
.composer textarea:focus{outline:none}
.send{width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--on-tint)}
.send .ic{width:19px;height:19px;stroke-width:2.4}
.acc{background:var(--card);border-radius:var(--r-group);overflow:hidden}
.acc details{position:relative}
.acc details+details::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--sep)}
.acc summary{display:flex;align-items:center;gap:14px;min-height:54px;padding:10px 16px;list-style:none;font-weight:600;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .chev{margin-left:auto;transition:transform .3s var(--out)}
.acc details[open] summary .chev{transform:rotate(90deg)}
.acc-body{padding:0 16px 16px 60px;font-size:15px;line-height:21px;color:var(--label-2)}
.acc-body p{margin:0 0 8px}
.acc-body b{color:var(--label);font-weight:600}
.acc-body ul,.acc-body ol{margin:0 0 8px;padding-left:18px}
.acc-body li{margin:3px 0}
.faq summary{font-weight:500}

/* ---------- Dock: tab bar + mini player ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
.dock>*{pointer-events:auto}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);width:min(100%,460px);height:62px;padding:4px;border-radius:999px}
.tab-lens{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 5);border-radius:999px;background:var(--lens);box-shadow:inset 0 0 0 .5px var(--glass-stroke);transition:transform .5s var(--spring)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border:0;border-radius:999px;background:none;color:var(--label);font:600 10px/12px var(--font)}
.tab .ic{width:25px;height:25px;transition:transform .3s var(--spring)}
.tab:active .ic{transform:scale(.88)}
.tab[aria-selected="true"]{color:var(--tint-ink)}
.mini{display:flex;align-items:center;gap:12px;width:min(100%,460px);min-height:58px;padding:8px 9px 8px 16px;border:0;border-radius:999px;text-align:left;color:var(--label)}
.mini b{display:block;font-size:15px;line-height:20px;font-weight:600}
.mini small{display:block;font-size:13px;line-height:17px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-time{font:700 20px/1 var(--font-round);color:var(--tint-ink)}
.mini.resting .mini-time{color:var(--orange-ink)}
.mini-play{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--on-tint)}
.mini-play .ic{width:18px;height:18px}

/* ---------- Sheet, alert, toast ---------- */
.layer{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .35s}
.sheet{position:relative;display:flex;flex-direction:column;width:min(100%,600px);max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);padding-bottom:env(safe-area-inset-bottom,0px);border-radius:34px 34px 0 0;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 -10px 40px rgba(0,0,0,.18),inset 0 1px 0 var(--glass-hi);transform:translateY(105%);transition:transform .45s var(--out)}
.layer.open .backdrop{opacity:1}
.layer.open .sheet{transform:none}
.sheet-grab{display:flex;align-items:center;justify-content:center;height:24px;flex:none;touch-action:none;cursor:grab}
.sheet-grab i{width:38px;height:5px;border-radius:3px;background:var(--label-3)}
.sheet-close{position:absolute;top:14px;right:14px;z-index:2;width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label-2)}
.sheet-close .ic{width:17px;height:17px;stroke-width:2.4}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px 28px}
.alert-layer{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.28);opacity:0;transition:opacity .2s}
.alert-layer.open{opacity:1}
.alert{width:min(100%,320px);padding:22px 18px 16px;border-radius:32px;text-align:center;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 1px 0 var(--glass-hi);transform:scale(1.08);transition:transform .35s var(--spring)}
.alert-layer.open .alert{transform:none}
.alert h3{margin:0 0 6px;font:600 17px/22px var(--font)}
.alert p{margin:0 0 16px;font-size:14px;line-height:19px;color:var(--label-2)}
.alert-btns{display:flex;gap:8px}
.alert-btns .btn{flex:1;min-height:46px;padding:0 10px;font-size:16px}
.toast-wrap{position:fixed;top:0;left:0;right:0;z-index:95;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;pointer-events:none}
.toast{max-width:100%;padding:11px 18px;border-radius:999px;font:600 15px/20px var(--font);text-align:center;opacity:0;visibility:hidden;transform:translateY(-24px) scale(.92);transition:transform .45s var(--spring),opacity .25s,visibility 0s .45s}
.toast.show{opacity:1;visibility:visible;transform:none;transition:transform .45s var(--spring),opacity .2s,visibility 0s}
body.locked .toast-wrap{padding-top:calc(env(safe-area-inset-top,0px) + 70px)}

/* ---------- Workout ---------- */
.workout{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .5s var(--out)}
.workout.open{transform:none}
.workout::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 38% at 50% -8%,var(--wall-a),transparent 70%)}
.w-head{display:flex;align-items:center;gap:10px;max-width:640px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px}
.w-head .circle-btn{width:42px;height:42px;border-radius:50%}
.w-title{flex:1;min-width:0;text-align:center}
.w-title b{display:block;font:600 17px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-title span{font:600 13px/16px var(--font-round);color:var(--label-2)}
.w-progress{max-width:608px;width:calc(100% - 32px);height:4px;margin:0 auto;border-radius:2px;background:var(--fill);overflow:hidden}
.w-progress i{display:block;height:100%;border-radius:2px;background:var(--tint);transition:width .5s var(--out)}
.w-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 132px)}
.w-inner{max-width:608px;margin:0 auto}
.warm{margin-bottom:14px;padding:6px 0;background:var(--card);border-radius:26px}
.warm-h{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;font:600 17px/22px var(--font)}
.warm-h .ic{color:var(--orange)}
.warm-h small{font:600 14px var(--font-round);color:var(--label-2)}
.check-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;background:none;text-align:left;font-size:15px;line-height:20px}
.cbox{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px var(--label-3);color:transparent;transition:background .2s}
.cbox .ic{width:16px;height:16px;stroke-width:3}
.check-row.on .cbox{background:var(--tint);box-shadow:none;color:var(--on-tint)}
.check-row.on .grow{color:var(--label-2);text-decoration:line-through}
.ex-card{margin-bottom:14px;padding:16px 14px 12px;background:var(--card);border-radius:26px;transition:box-shadow .3s}
.ex-card.complete{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--green) 60%,transparent)}
.exc-head{display:flex;align-items:flex-start;gap:12px}
.exc-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tint-soft);color:var(--tint-ink);font:700 15px/1 var(--font-round)}
.ex-card.complete .exc-n{background:var(--green);color:#fff}
.exc-t{flex:1;min-width:0}
.exc-t h3{margin:0;font:600 18px/23px var(--font)}
.exc-t p{margin:2px 0 0;font-size:13px;line-height:17px;color:var(--label-2)}
.exc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--fill);font:600 13px/18px var(--font);color:var(--label-2)}
.tag .ic{width:14px;height:14px}
.sug{margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:var(--fill);font-size:14px;line-height:19px}
.sug-up{background:color-mix(in srgb,var(--green) 15%,transparent)}
.sug-up b{color:var(--green-ink)}
.sug-down{background:color-mix(in srgb,var(--orange) 15%,transparent)}
.set-grid{display:grid;grid-template-columns:34px minmax(0,1fr) 76px 62px 46px;align-items:center;gap:8px}
.set-head{padding:6px 0 4px;font:600 12px/16px var(--font);color:var(--label-2)}
.set-head span:nth-child(3),.set-head span:nth-child(4){text-align:center}
.set{padding:4px 0}
.set-n{font:700 16px/1 var(--font-round);color:var(--label-2);text-align:center}
.set-prev{font:500 14px/1.2 var(--font-round);color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{width:100%;height:46px;padding:0 4px;border:0;border-radius:14px;background:var(--fill);font:600 18px/1 var(--font-round);text-align:center;color:var(--label);-webkit-appearance:none;appearance:none}
.inp::placeholder{color:var(--label-3)}
.inp:focus{outline:2px solid var(--tint);outline-offset:0;background:var(--card)}
.chk{width:46px;height:46px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label-3);transition:transform .3s var(--spring),background .2s}
.chk .ic{width:22px;height:22px;stroke-width:2.8}
.chk:active{transform:scale(.86)}
.set.done .chk{background:var(--green);color:#fff}
.set.done .inp{background:color-mix(in srgb,var(--green) 13%,transparent)}
.exc-actions{display:flex;gap:8px;margin-top:10px}
.exc-actions .btn{flex:1 1 auto;min-width:0;padding:0 10px;white-space:nowrap}
@media (max-width:360px){.exc-actions{gap:6px}.exc-actions .btn{padding:0 8px;font-size:14px}.exc-actions .btn .ic{display:none}.set-grid{grid-template-columns:30px minmax(0,1fr) 70px 56px 44px;gap:6px}}
.w-end{margin:6px 0 0}

/* ---------- Rest island (the one bold thing) ---------- */
.island-wrap{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none;transition:opacity .2s}
.workout.typing .island-wrap{opacity:0}
.workout.typing .island{pointer-events:none}
.island{position:relative;width:232px;height:60px;overflow:hidden;border-radius:30px;background:#000;color:#fff;pointer-events:auto;box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.16);transition:width .55s var(--spring),height .55s var(--spring),border-radius .55s var(--spring),background-color .3s}
.island.expanded{width:min(100%,400px);height:152px;border-radius:40px}
.isl-face{display:flex;align-items:center;gap:12px;width:100%;height:60px;padding:0 18px 0 10px;border:0;background:none;color:inherit;text-align:left}
.isl-ring{width:40px;height:40px;flex:none;transform:rotate(-90deg)}
.isl-ring circle{fill:none;stroke-width:5}
.isl-ring .trk{stroke:rgba(255,255,255,.18)}
.isl-ring .bar{stroke:#3FD0D9;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.island[data-state="idle"] .isl-ring .bar{stroke:#30D158}
.isl-main{flex:1;display:flex;flex-direction:column;min-width:0}
.isl-main b{font:700 22px/25px var(--font-round);font-variant-numeric:tabular-nums;white-space:nowrap}
.isl-main small{font:500 12px/15px var(--font);color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl-side{font:600 15px/1 var(--font-round);color:rgba(255,255,255,.72)}
.isl-ctrl{padding:0 14px 14px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .35s var(--out)}
.island.expanded .isl-ctrl{opacity:1;transform:none;transition-delay:.12s}
.isl-ctrl p{margin:0 4px 10px;font-size:13px;line-height:17px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl-btns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.isl-btns button{height:44px;border:0;border-radius:22px;background:rgba(255,255,255,.15);color:#fff;font:600 15px/1 var(--font)}
.isl-btns .go{background:#3FD0D9;color:#00292D}
.island[data-state="go"]{background-color:#17803A;animation:islPulse .6s var(--spring) 2}
@keyframes islPulse{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ---------- Summary ---------- */
.summary{text-align:center;padding-top:4px}
.sum-badge{width:72px;height:72px;margin:0 auto 12px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#FF9F0A,#FF375F);box-shadow:0 14px 30px -12px #FF375F}
.sum-badge .ic{width:36px;height:36px}
.summary h2{margin:0;font:700 28px/34px var(--font-display)}
.summary>p{margin:4px 0 16px;color:var(--label-2)}
.summary .group,.summary .stats3{text-align:left}
.summary .stats3{text-align:center}
.sum-tip{margin:16px 6px;font-size:15px;line-height:20px;color:var(--label-2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:700px){.hero-title{font-size:48px;line-height:52px}}

</style>
</head>
<body>
<div class="edge" id="edge" aria-hidden="true"><span id="edgeTitle"></span></div>
<main class="app">
  <section class="view" data-view="today" id="view-today" aria-label="Aujourd’hui"></section>
  <section class="view" data-view="program" id="view-program" aria-label="Programme" hidden></section>

/* Sections synchronisées : profile, body, active, hist-AAAA-MM, nutri-AAAA-MM */
function buildSection(id) {
  if (id === 'profile') return { profile: S.profile, settings: S.settings };
  if (id === 'body') return { weights: S.weights, measures: S.measures };
  if (id === 'active') return { active: S.active };
  if (id.startsWith('hist-')) { const m = id.slice(5); return { sessions: S.history.filter((h) => monthKey(h.date) === m) }; }

}
function applySection(id, data) {
  const d = defaultState();
  if (id === 'profile') { S.profile = { ...d.profile, ...(data.profile || {}) }; S.settings = { ...d.settings, ...(data.settings || {}) }; }
  else if (id === 'body') { S.weights = Array.isArray(data.weights) ? data.weights : []; S.measures = Array.isArray(data.measures) ? data.measures : []; }
  else if (id === 'active') { S.active = data.active || null; }
  else if (id.startsWith('hist-')) { const m = id.slice(5); S.history = S.history.filter((h) => monthKey(h.date) !== m).concat(Array.isArray(data.sessions) ? data.sessions : []).sort((a, b) => a.start - b.start); }

}

const SYNC_LABEL = { local: 'Sur cet appareil', connecting: 'Connexion…', synced: 'Synchronisée avec ton compte', error: 'En attente de réseau' };

const Sync = {
  db: null, uid: null, status: 'local', timer: null, flushing: false, backoff: 0,
  dirty: (() => { try { return new Set(JSON.parse(localStorage.getItem(LS + '.dirty') || '[]')); } catch (e) { return new Set(); } })(),
  saveDirty() { try { localStorage.setItem(LS + '.dirty', JSON.stringify([...this.dirty])); } catch (e) { /* ignore */ } },
  setStatus(s) { this.status = s; const el = $('#syncStatus'); if (el) el.textContent = SYNC_LABEL[s]; },
  col() { return this.db.collection('data/users/' + this.uid); },
  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') return this.setStatus('local');
    this.setStatus('connecting');
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return this.setStatus('local');
      const id = await user.id();
      if (!id) return this.setStatus('local');
      this.db = db; this.uid = id;
      await this.pull();

    } catch (e) { this.db = null; this.setStatus('local'); }

  async pull() {

    let changed = false; const remote = new Set();
    snap.docs.forEach((doc) => {
      if (!doc.exists) return;
      remote.add(doc.id);
      const data = doc.data() || {}; const rts = Number(data.updatedAt) || 0; const lts = S.meta[doc.id] || 0;
      if (rts > lts) { applySection(doc.id, data); S.meta[doc.id] = rts; this.dirty.delete(doc.id); changed = true; }
      else if (lts > rts) this.dirty.add(doc.id);
    });
    localSectionIds().forEach((id) => { if (!remote.has(id) && S.meta[id]) this.dirty.add(id); });
    ['profile', 'body'].forEach((id) => { if (!remote.has(id) && !S.meta[id]) { S.meta[id] = Date.now(); this.dirty.add(id); } });

/* ===================== Logique d'entraînement ===================== */
const tplById = (id) => PROGRAM.find((t) => t.id === id) || PROGRAM[0];
function nextTpl() {
  for (let i = S.history.length - 1; i >= 0; i--) { const idx = PROGRAM.findIndex((t) => t.id === S.history[i].tpl); if (idx >= 0) return PROGRAM[(idx + 1) % PROGRAM.length]; }
  return PROGRAM[0];
}
function nextTrainingDate(from = new Date()) {
  const days = S.settings.days || [];

  return null;
}
const relDay = (d) => { const diff = dayDiff(new Date(), d); return diff === 0 ? 'aujourd’hui' : diff === 1 ? 'demain' : DAYS_L[wdOf(d)]; };
function cycleInfo(d = new Date()) {
  const start = parseISO(S.settings.cycleStart || isoDate(mondayOf(d)));
  const w = Math.max(0, Math.floor(dayDiff(start, d) / 7));

}
const setsFor = (it, deload) => (deload ? Math.ceil(it.sets / 2) : it.sets);
const totalSets = (t, deload) => t.items.reduce((a, it) => a + setsFor(it, deload), 0);

const e1rm = (w, r) => (w > 0 && r > 0 ? w * (1 + r / 30) : 0);
function lastPerf(exId, before = Infinity) {
  for (let i = S.history.length - 1; i >= 0; i--) {
    const h = S.history[i]; if (!(h.start < before)) continue;
    const e = (h.exercises || []).find((x) => x.ex === exId);
    if (e && e.sets && e.sets.length) return { date: h.date, sets: e.sets };
  }
  return null;
}
function bestOf(exId, before = Infinity) {

    if (!(h.start < before)) return;
    (h.exercises || []).forEach((e) => { if (e.ex !== exId) return; e.sets.forEach((s) => { const v = e1rm(s.w, s.r); if (v && (!best || v > best.v)) best = { v, w: s.w, r: s.r, date: h.date }; }); });

}
/* Double progression : renvoie la charge conseillée et la consigne */
function suggestion(exId, item, deload) {
  const ex = EX[exId], lo = item.reps[0], hi = item.reps[1], last = lastPerf(exId), u = unit();
  const W = (kg) => `${fmt(toDisp(kg), 2)} ${u}`;
  if (!last) {
    if (ex.bw) return { kind: 'new', w: 0, text: `Vise ${lo} à ${hi} répétitions propres, sans élan.` };
    if (ex.assisted) return { kind: 'new', w: null, text: `Première fois : règle une assistance qui te permet ${hi} répétitions propres, avec 2 ou 3 en réserve.` };
    return { kind: 'new', w: null, text: `Première fois : choisis une charge que tu pourrais soulever ${hi + 3} fois, et arrête-toi à ${hi}.` };
  }
  const sets = last.sets.filter((s) => s.r > 0);
  if (!sets.length) return { kind: 'new', w: null, text: `Vise ${lo} à ${hi} répétitions.` };
  const ref = sets[0].w || 0;
  const atRef = sets.filter((s) => (s.w || 0) === ref);
  const minR = Math.min(...atRef.map((s) => s.r));
  const allTop = atRef.length >= Math.min(item.sets, sets.length) && atRef.every((s) => s.r >= hi);
  const inc = !ex.inc ? 0 : unit() === 'lb' ? (ex.inc >= 10 ? 20 : ex.inc >= 5 ? 10 : 5) / LB : ex.inc;
  if (deload) return { kind: 'keep', w: ref, text: ex.bw ? `Semaine de décharge : ${lo} répétitions faciles par série.` : `Semaine de décharge : garde ${W(ref)} et arrête-toi 3 répétitions avant l’échec.` };
  if (ex.bw) return allTop ? { kind: 'up', w: 0, text: '<b>Objectif atteint</b> la dernière fois : descends sur 3 secondes pour rendre l’exercice plus dur.' } : { kind: 'keep', w: 0, text: `Bats tes répétitions de la dernière fois : ${sets.map((s) => s.r).join(', ')}.` };
  if (allTop && inc) {
    const nw = ex.assisted ? Math.max(0, ref - inc) : ref + inc;
    return { kind: 'up', w: nw, text: ex.assisted ? `<b>${hi} répétitions partout</b> la dernière fois : baisse l’assistance à ${W(nw)}.` : `<b>${hi} répétitions partout</b> la dernière fois : monte à ${W(nw)}.` };
  }
  if (minR < lo - 1 && inc) {
    const nw = ex.assisted ? ref + inc : Math.max(0, ref - inc);
    return { kind: 'down', w: nw, text: ex.assisted ? `Trop dur la dernière fois (${minR} répétitions) : remonte l’assistance à ${W(nw)}.` : `Trop lourd la dernière fois (${minR} répétitions) : redescends à ${W(nw)}.` };
  }
  return { kind: 'keep', w: ref, text: `Garde ${W(ref)} et gagne une répétition par série, jusqu’à ${hi}.` };
}
function setsDone(a) { let done = 0, total = 0; (a ? a.items : []).forEach((it) => it.log.forEach((s) => { total++; if (s.done) done++; })); return { done, total }; }

/* ===================== Nutrition & poids ===================== */
function weightTrend() {
  const ws = S.weights.filter((x) => x && x.kg > 0 && x.d).slice().sort((a, b) => a.d.localeCompare(b.d));
  if (!ws.length) return null;
  const today = new Date();
  const inWin = (x, from, to) => { const dd = dayDiff(parseISO(x.d), today); return dd >= from && dd < to; };
  const cur = ws.filter((x) => inWin(x, 0, 7)), prev = ws.filter((x) => inWin(x, 7, 14));
  const mean = (a) => a.reduce((s, x) => s + x.kg, 0) / a.length;
  const last = ws[ws.length - 1];
  return { ws, last, avg: cur.length ? mean(cur) : last.kg, rate: cur.length >= 2 && prev.length >= 2 ? mean(cur) - mean(prev) : null };
}
const currentWeight = () => { const tr = weightTrend(); return tr ? tr.avg : S.profile.startWeight; };
function targets() {
  const p = S.profile, w = currentWeight();
  const bmr = 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * p.activity;
  const kcal = Math.round((tdee + Number(S.settings.surplus) + Number(S.settings.kcalAdjust || 0)) / 50) * 50;
  const prot = Math.round((w * 2) / 5) * 5;
  const fat = Math.round((kcal * 0.25) / 9 / 5) * 5;
  const carbs = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4 / 5) * 5);
  const water = Math.round((w * 35 + 750) / 250) * 250;
  return { bmr, tdee, kcal, prot, fat, carbs, water };
}
const dayLog = (iso = isoDate()) => S.nutrition[iso] || { items: [], water: 0 };
function ensureDay(iso = isoDate()) { if (!S.nutrition[iso]) S.nutrition[iso] = { items: [], water: 0 }; return S.nutrition[iso]; }
const dayTotals = (day) => day.items.reduce((a, it) => ({ k: a.k + (it.k || 0), p: a.p + (it.p || 0) }), { k: 0, p: 0 });
function weightAdvice(tr) {
  if (!tr || tr.rate == null) return { kind: 'info', text: 'Pèse-toi 3 à 4 matins par semaine, à jeun. Après deux semaines, je te dis s’il faut manger plus ou moins.' };
  const r = tr.rate;
  const recent = S.settings.lastAdjust && dayDiff(parseISO(S.settings.lastAdjust), new Date()) < 10;
  const wait = recent ? ' Tu as ajusté ta cible il y a moins de 10 jours : laisse-lui une semaine de plus.' : '';
  if (r < 0.15) return { kind: 'warn', text: `Tu prends ${sgn(r)} kg par semaine : trop lent pour construire du muscle. Ajoute 150 kcal par jour, un verre de lait et une banane par exemple.${wait}`, delta: recent ? 0 : 150 };
  if (r > 0.4) return { kind: 'warn', text: `Tu prends ${sgn(r)} kg par semaine : un peu rapide, une partie sera du gras. Retire 100 kcal par jour.${wait}`, delta: recent ? 0 : -100 };
  return { kind: 'good', text: `${sgn(r)} kg par semaine : tu es dans la cible (+0,15 à +0,4 kg). Ne change rien.` };
}

/* ===================== Graphiques ===================== */
function ringsSVG(rs, size) {
  const sw = size > 100 ? 13 : 10, gap = 3, c = size / 2;
  let out = `<svg class="rings" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">`;
  rs.forEach((r, i) => {
    const rad = c - sw / 2 - i * (sw + gap), C = 2 * Math.PI * rad, p = clamp(r.max ? r.v / r.max : 0, 0, 1);
    out += `<circle cx="${c}" cy="${c}" r="${rad}" fill="none" style="stroke:${r.c};stroke-opacity:.2" stroke-width="${sw}"/>`;
    if (p > 0) out += `<circle cx="${c}" cy="${c}" r="${rad}" fill="none" style="stroke:${r.c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - p)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
  });
  return out + '</svg>';
}
function lineChart(series, opts = {}) {
  const W = 340, H = opts.h || 170, L = 36, R = 12, T = 12, B = 24;
  const all = series.flatMap((s) => s.pts); if (!all.length) return '';
  let minX = Math.min(...all.map((p) => p.x)), maxX = Math.max(...all.map((p) => p.x));
  let minY = Math.min(...all.map((p) => p.y)), maxY = Math.max(...all.map((p) => p.y));
  if (maxX === minX) { minX -= 864e5 * 3; maxX += 864e5 * 3; }
  const padY = Math.max((maxY - minY) * 0.15, opts.minPad || 0.5); minY -= padY; maxY += padY;
  const sx = (x) => L + ((x - minX) / (maxX - minX)) * (W - L - R);
  const sy = (y) => T + (1 - (y - minY) / (maxY - minY)) * (H - T - B);
  const yf = opts.yFmt || ((n) => fmt(n, 1));
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = minY + ((maxY - minY) * i) / 3, y = sy(v).toFixed(1); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${yf(v)}</text>`; }
  g += `<text x="${L}" y="${H - 6}">${dateShort(new Date(minX))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${dateShort(new Date(maxX))}</text>`;
  series.forEach((s) => {
    const p = s.pts.slice().sort((a, b) => a.x - b.x);
    if (s.cls === 'dots') { g += p.map((q) => `<circle class="pt-s" cx="${sx(q.x).toFixed(1)}" cy="${sy(q.y).toFixed(1)}" r="2.6"/>`).join(''); return; }
    const d = p.map((q, i) => `${i ? 'L' : 'M'}${sx(q.x).toFixed(1)} ${sy(q.y).toFixed(1)}`).join(' ');
    if (s.area && p.length > 1) g += `<path class="area" d="${d} L${sx(p[p.length - 1].x).toFixed(1)} ${H - B} L${sx(p[0].x).toFixed(1)} ${H - B} Z"/>`;
    g += `<path class="${s.cls}" d="${d}"/>`;
    if (s.endDot) { const q = p[p.length - 1]; g += `<circle class="pt" cx="${sx(q.x).toFixed(1)}" cy="${sy(q.y).toFixed(1)}" r="4.5"/>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Graphique')}"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tint);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--tint);stop-opacity:0"/></linearGradient></defs>${g}</svg>`;
}

let actx = null;
function audioUnlock() {
  try {
    if (!actx) { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }

      const o = actx.createOscillator(), g = actx.createGain();

    });
  } catch (e) { /* audio indisponible */ }
}

    <div class="callout ${adv.kind}">${ic(adv.kind === 'good' ? 'check' : 'info')}<div><p>${adv.text}</p>${adv.delta ? `<button class="btn btn-tint btn-sm mt8" data-action="apply-adjust" data-d="${adv.delta}">Appliquer ${adv.delta > 0 ? '+' : '−'}${Math.abs(adv.delta)} kcal</button>` : ''}</div></div>`

const Coach = { sample: null, disabled: false, turns: [], busy: false, ctl: null };
const COACH_ERR = { rate_limited: 'Trop de questions d’affilée. Attends un peu avant de réessayer.', session_expired: 'Ta session a expiré. Recharge la page.', refused: 'Le coach ne peut pas répondre à cette question.', prompt_too_large: 'Question trop longue : raccourcis-la.', empty_completion: 'Réponse vide. Reformule ta question.' };
function md(s) {
  const inline = (x) => x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let out = '', list = null;
  esc(s).split(/\n/).forEach((raw) => {
    const l = raw.trim(), mU = l.match(/^[-•*]\s+(.*)/), mO = l.match(/^\d+[.)]\s+(.*)/);
    if (mU || mO) { const type = mU ? 'ul' : 'ol'; if (list !== type) { if (list) out += `</${list}>`; out += `<${type}>`; list = type; } out += `<li>${inline((mU || mO)[1])}</li>`; return; }
    if (list) { out += `</${list}>`; list = null; }
    if (!l) return;
    out += /^#{1,6}\s/.test(l) ? `<p><b>${inline(l.replace(/^#+\s*/, ''))}</b></p>` : `<p>${inline(l)}</p>`;
  });
  if (list) out += `</${list}>`;
  return out;
}
function msgHTML(t) {
  if (t.role === 'user') return `<div class="msg me">${esc(t.content)}</div>`;
  let h = '';
  if (t.pending && !t.content) h = '<div class="msg bot"><span class="thinking"><i></i>Réflexion…</span></div>';
  else if (t.content) h = `<div class="msg bot">${md(t.content)}</div>`;
  if (t.error) h += `<p class="msg-err">${esc(t.error)}</p>`;
  if (t.note) h += `<p class="msg-err">${esc(t.note)}</p>`;
  return h;
}
function chatHTML() {

  <div class="composer"><textarea id="coachIn" rows="1" placeholder="Ta question pour le coach" aria-label="Ta question pour le coach"></textarea>${Coach.busy ? `<button class="send" data-action="coach-stop" aria-label="Arrêter la réponse">${ic('stop')}</button>` : `<button class="send" data-action="coach-send" aria-label="Envoyer">${ic('send')}</button>`}</div></section>`;

function coachContext() {
  const p = S.profile, T = targets(), cyc = cycleInfo(), tr = weightTrend(), day = dayTotals(dayLog());
  const prog = PROGRAM.map((t) => `- ${t.name} (${t.focus}) : ${t.items.map((it) => `${EX[it.ex].n} ${it.sets}×${it.reps[0]}-${it.reps[1]}`).join(', ')}`).join('\n');
  const last = S.history.slice(-3).map((h) => `- ${h.date}, ${h.name} : ${(h.exercises || []).map((e) => { const ex = EX[e.ex]; return `${ex ? ex.n : e.ex} ${e.sets.map((s) => (ex && ex.bw ? '' : `${fmt(toDisp(s.w), 2)}${unit()}×`) + s.r).join('/')}`; }).join(' ; ')}`).join('\n') || '- aucune séance enregistrée pour l’instant';
  return `Tu es le coach sportif personnel de l’utilisateur dans son application d’entraînement « Charge ». Réponds en français, en le tutoyant, en 150 mots maximum, avec des conseils concrets applicables tout de suite. Utilise une courte liste si c’est utile. Ne propose que des exercices faisables sur les machines principales d’une salle universitaire (salle de HKUST : machines guidées, poulies, éventuellement une Smith machine), pas de barre libre. En cas de douleur, de blessure ou de symptôme inhabituel, conseille d’arrêter l’exercice concerné et de consulter un professionnel de santé.

${prog}

function buildCoachInput() {
  const turns = [];
  Coach.turns.forEach((t) => {
    if (t.pending || (t.role === 'assistant' && !t.content)) return;
    const prev = turns[turns.length - 1];
    if (prev && prev.role === t.role) prev.content += '\n\n' + t.content; else turns.push({ role: t.role, content: t.content });
  });
  const recent = turns.slice(-8);
  while (recent.length && recent[0].role !== 'user') recent.shift();
  if (recent.length) recent[0] = { role: 'user', content: coachContext() + '\n\nQuestion : ' + recent[0].content };
  return recent;
}
function paintMsgs() { const box = $('#msgs'); if (box) box.innerHTML = Coach.turns.map(msgHTML).join(''); }
async function askCoach(q) {
  q = String(q || '').trim();
  if (!q || !Coach.sample || Coach.busy) return;
  const input = $('#coachIn'); if (input) input.value = '';
  Coach.turns.push({ role: 'user', content: q });
  const bot = { role: 'assistant', content: '', pending: true };
  Coach.turns.push(bot); Coach.busy = true; Coach.ctl = new AbortController();
  if (currentTab === 'coach') renderCurrent();
  try {
    const res = await Coach.sample(buildCoachInput(), { signal: Coach.ctl.signal, cache: false, onText: ({ text }) => { bot.content = text; bot.pending = false; paintMsgs(); } });
    bot.content = (res && res.text) || bot.content;
    if (res && res.truncated) bot.note = 'Réponse coupée : pose une question plus précise.';
  } catch (e) {
    const code = e && e.code;
    bot.content = (e && e.text) || bot.content || '';
    if (code !== 'cancelled') bot.error = COACH_ERR[code] || 'Le coach n’a pas pu répondre. Réessaie dans un instant.';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { Coach.disabled = true; toast('Coach IA désactivé pour cette visite'); }
  } finally {
    bot.pending = false; Coach.busy = false; Coach.ctl = null;
    if (currentTab === 'coach') renderCurrent();
  }
}

/* ===================== Sauvegarde : export et import ===================== */
async function exportData() {
  const filename = `charge-sauvegarde-${isoDate()}.json`;
  const data = JSON.stringify({ app: 'charge', version: 1, exportedAt: new Date().toISOString(), state: S });
  if (IN_CLAUDE) {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl) { toast('Export indisponible ici'); return; }
    try { await dl.save({ filename, data }); toast('Sauvegarde exportée'); }
    catch (e) { const c = e && e.code; if (c !== 'declined') toast(c === 'rate_limited' ? 'Une fenêtre d’enregistrement est déjà ouverte' : 'Export impossible ici'); }
    return;
  }
  try {
    const file = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Sauvegarde Charge' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Sauvegarde exportée');
}
function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => toast('Lecture du fichier impossible');
  reader.onload = async () => {
    let st = null;
    try { const obj = JSON.parse(String(reader.result)); st = obj && obj.app === 'charge' && obj.state ? obj.state : null; } catch (e) { st = null; }
    if (!st || typeof st.profile !== 'object' || !Array.isArray(st.history)) { toast('Ce fichier n’est pas une sauvegarde Charge'); return; }
    const ok = await ask({ title: 'Importer cette sauvegarde ?', msg: `${pl(st.history.length, 'séance')} et ${pl((st.weights || []).length, 'pesée')}. Les données actuelles de cet appareil seront remplacées.`, ok: 'Importer', danger: true });
    if (!ok) return;
    const old = new Set([...localSectionIds(), ...Object.keys(S.meta)]);
    if (workoutOpen) closeWorkoutHard();
    Ticker.stop();
    S = migrate(st); S.meta = {};
    persist(...new Set([...old, ...localSectionIds()]));
    saveLocalNow(); applyAppearance(); Sheet.close();
    if (S.active) Ticker.start();
    renderAll(); toast('Sauvegarde importée');
  };
  reader.readAsText(file);
}

let workoutOpen = false;
function startWorkout(tplId) {
  if (S.active) { if (S.active.tpl !== tplId) toast('Termine d’abord ta séance en cours'); openWorkout(); return; }
  audioUnlock();
  const tpl = tplById(tplId), cyc = cycleInfo();
  const items = tpl.items.map((it) => {
    const n = setsFor(it, cyc.deload), base = { sets: n, reps: it.reps };
    const sug = suggestion(it.ex, base, cyc.deload);
    return { ex: it.ex, orig: it.ex, sets: n, reps: it.reps, rest: it.rest, sug, log: Array.from({ length: n }, () => ({ w: sug.w, r: null, done: false })) };
  });
  S.active = { id: uid(), tpl: tpl.id, name: tpl.name, date: isoDate(), start: Date.now(), deload: cyc.deload, warm: WARMUP.map(() => false), items, restEnd: null, restTotal: 0, restLabel: '' };
  persist('active'); openWorkout(); renderCurrent();
}
function openWorkout() {
  if (!S.active) return;

const Rest = {

const Island = {
  goUntil: 0,

    return `<div class="island" id="island" data-state="idle"><button class="isl-face" data-action="island" id="islFace" aria-label="Minuteur">

      <div class="isl-ctrl"><p id="islNext"></p><div class="isl-btns"><button data-action="rest-add" data-d="-15">−15 s</button><button data-action="rest-add" data-d="15">+15 s</button><button class="go" data-action="rest-skip">Passer</button></div></div></div>`;

  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[role="button"][data-action]')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Enter' && t.id === 'coachIn' && !e.shiftKey) { e.preventDefault(); if (Coach.sample && !Coach.disabled) askCoach(t.value); else if (!IN_CLAUDE) openInClaude(t.value); return; }
  if (e.key === 'Enter' && t.classList && t.classList.contains('inp')) {
    e.preventDefault();
    if (t.dataset.f === 'w') { const r = t.closest('.set').querySelector('[data-f="r"]'); if (r) r.focus(); } else t.blur();
    return;
  }
  if (e.key === 'Escape' && $('#alertLayer').hidden) { if (Sheet.isOpen) Sheet.close(); else if (workoutOpen) minimizeWorkout(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches('input[type=range][data-set]')) setFromInput(el, true);
  else if (el.classList.contains('inp') && el.closest('#workout')) onSetInput(el);
  else if (el.id === 'coachIn') { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('[data-set]')) setFromInput(el, el.type === 'range');
  else if (el.id === 'chartEx') { ui.chartEx = el.value; renderCurrent(); }
  else if (el.id === 'importFile') { importBackup(el.files && el.files[0]); el.value = ''; }
});
document.addEventListener('focusin', (e) => { if (e.target.classList && e.target.classList.contains('inp')) { const w = $('#workout'); if (w) w.classList.add('typing'); } });
document.addEventListener('focusout', (e) => { if (e.target.classList && e.target.classList.contains('inp')) setTimeout(() => { const f = document.activeElement; if (!(f && f.classList && f.classList.contains('inp'))) { const w = $('#workout'); if (w) w.classList.remove('typing'); } }, 60); });

/* Glisser la feuille vers le bas pour la fermer */
(function dragSheet() {
  const grab = $('#sheetGrab'), sheet = $('#sheet'); let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', (e) => { y0 = e.clientY; dy = 0; sheet.style.transition = 'none'; try { grab.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } });
  grab.addEventListener('pointermove', (e) => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; sheet.style.transition = ''; sheet.style.transform = ''; if (dy > 110) Sheet.close(); };
  grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
})();

/* ===================== Démarrage ===================== */
function init() {
  if (firstRun) saveLocalNow();
  applyAppearance();
  $$('.tab').forEach((b) => b.insertAdjacentHTML('afterbegin', ic(TAB_IC[b.dataset.tab])));
  $('#miniPlay').innerHTML = ic('play');
  $('#sheetClose').innerHTML = ic('x');
  showTab('today');
  if (S.active) { Ticker.start(); Mini.show(); }
  window.addEventListener('scroll', updateEdge, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { saveLocalNow(); Sync.flush(); return; }
    if (workoutOpen) keepAwake(true);
    if (renderedDay !== isoDate() && !Sheet.isOpen) renderCurrent();
  });
  window.addEventListener('pagehide', saveLocalNow);
  window.addEventListener('online', () => Sync.flush());
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignore */ }
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyAppearance); } catch (e) { /* ignore */ }
  Sync.init();
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then((s) => { if (s) { Coach.sample = s; if (currentTab === 'coach') renderCurrent(); } }).catch(() => { /* coach IA indisponible */ });
  }
}
init();

</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
